name: Integracion continua

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo para buscar secretos

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pip-audit

      - name: Linter (ruff)
        run: ruff check .

      - name: Pruebas automaticas con cobertura minima de 60%
        run: pytest --cov --cov-report=term --cov-fail-under=60

      - name: Puerta de calidad de datos (bronce -> plata -> oro)
        run: python -m pipeline.run

      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secretos expuestos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
